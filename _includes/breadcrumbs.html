{% if page.breadcrumbs %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="/">Home</a></li>
    {% for crumb in page.breadcrumbs %}
    <li{% if forloop.last %} aria-current="page"{% endif %}>
      {% if forloop.last %}
        {{ crumb.title }}
      {% else %}
        <a href="{{ crumb.url }}">{{ crumb.title }}</a>
      {% endif %}
    </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}

# O*NET Interest Profiler Short Form — 60 items
#
# Source: U.S. Department of Labor, Employment & Training Administration.
# Developed by the National Center for O*NET Development.
# Public domain. Released 2010 (Rounds, Su, Lewis & Rivkin).
# Original PDF: https://www.onetcenter.org/dl_tools/ipsf/Interest_Profiler.pdf
#
# Each item is a "work activity." Items are grouped by RIASEC dimension:
#   R = Realistic
#   I = Investigative
#   A = Artistic
#   S = Social
#   E = Enterprising
#   C = Conventional
#
# Original instrument uses a binary check / no-check response.
# This app uses the validated 5-point Likert form (Short Form computerized version):
#   0 = Strongly Dislike
#   1 = Dislike
#   2 = Unsure
#   3 = Like
#   4 = Strongly Like
# Per-dimension score range with 5-point scale: 0-40 (10 items x 0-4).

version: "1.0"
instrument: "O*NET Interest Profiler Short Form"
source_url: "https://www.onetcenter.org/dl_tools/ipsf/Interest_Profiler.pdf"
response_scale:
  type: "likert_5"
  min: 0
  max: 4
  labels:
    0: "Strongly Dislike"
    1: "Dislike"
    2: "Unsure"
    3: "Like"
    4: "Strongly Like"


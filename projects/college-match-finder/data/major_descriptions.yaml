"45.04":
  name: "Criminology"
  overview: >
    Criminology is the scientific study of crime, criminal behavior, and
    societal responses to crime. While it overlaps with criminal justice,
    criminology is more research-oriented and theoretical, focused on the
    causes and patterns of criminal behavior rather than the operational
    workings of the justice system. Drawing from sociology, psychology,
    economics, and statistics, the curriculum examines theories of why
    people commit crimes, how communities and institutions shape offending
    and victimization, and how policy interventions affect crime rates.
    Coursework develops quantitative analytical skills alongside
    theoretical understanding. Graduates pursue careers in research,
    policy analysis, victim services, federal investigation, corrections
    administration, and increasingly in private-sector fraud and risk
    analysis. Many continue to graduate study in criminology, sociology,
    public policy, or law school.
  what_youll_learn:
    - "Criminological theories explaining the causes of crime"
    - "Quantitative research methods and crime data analysis"
    - "Patterns of victimization and the experience of crime"
    - "Crime policy evaluation and the effects of criminal justice intervention"
    - "Specialized topics: white-collar crime, juvenile delinquency, terrorism"
  typical_classes:
    - "Introduction to Criminology"
    - "Criminological Theory"
    - "Research Methods in Criminology"
    - "Criminal Justice Statistics"
    - "Juvenile Delinquency"
    - "Victimology"
    - "Corrections and Punishment"
    - "Senior Seminar or Capstone in Criminology"
  related_majors:
    - "Criminal Justice"
    - "Sociology"
    - "Psychology"
    - "Political Science"

"11.10":
  name: "Information Technology Administration and Management"
  overview: >
    Information Technology Administration and Management trains students
    to plan, deploy, and manage the technology infrastructure that
    organizations depend on — networks, servers, cloud services, security
    systems, and end-user support. The curriculum is more applied than a
    Computer Science degree, focusing on operational IT skills: network
    administration, system installation and configuration, cybersecurity,
    cloud platforms, and IT project management. Programs typically
    integrate hands-on lab work with industry certifications like CompTIA,
    Cisco, and Microsoft credentials. Coursework also includes
    communication, ethics, and the management dimensions of IT — vendor
    relationships, budgeting, and aligning IT operations with business
    needs. Graduates work as systems administrators, network engineers,
    IT support specialists, cybersecurity analysts, and cloud
    administrators, with pathways into IT leadership and specialization.
  what_youll_learn:
    - "Network administration: configuration, troubleshooting, and security"
    - "Server and operating system administration (Windows and Linux)"
    - "Cybersecurity fundamentals and risk management"
    - "Cloud platforms and virtualization technologies"
    - "IT project management and service delivery"
  typical_classes:
    - "Introduction to Information Technology"
    - "Computer Networks and Administration"
    - "Operating Systems Administration"
    - "Cybersecurity Fundamentals"
    - "Cloud Computing"
    - "Database Administration"
    - "IT Project Management"
    - "Senior Capstone or Internship"
  related_majors:
    - "Computer and Information Sciences, General"
    - "Cybersecurity"
    - "Information Science / Studies"
    - "Management Information Systems"

"40.08":
  name: "Physics"
  overview: >
    Physics is the study of matter, energy, space, and time at the deepest
    level — the fundamental laws underlying everything from subatomic
    particles to the structure of the universe. Students learn to model
    physical systems mathematically, design experiments to test
    predictions, and reason from first principles. The curriculum is
    mathematically intensive, progressing from classical mechanics and
    electromagnetism through quantum mechanics, thermodynamics, and
    relativity, with substantial laboratory work and often a research
    thesis. The major develops exceptional problem-solving skills,
    quantitative reasoning, and comfort with abstraction that transfer
    across many fields. Graduates pursue careers in scientific research,
    engineering, software development, finance (especially quantitative
    finance), data science, education, and medical physics, with strong
    pathways into graduate study in physics, engineering, and applied
    mathematics.
  what_youll_learn:
    - "Classical mechanics: Newton's laws, energy, and rotational motion"
    - "Electromagnetism and Maxwell's equations"
    - "Quantum mechanics and the structure of atoms"
    - "Thermodynamics and statistical mechanics"
    - "Mathematical methods for physics: differential equations, vector calculus"
  typical_classes:
    - "Introductory Physics with Calculus I and II"
    - "Modern Physics"
    - "Classical Mechanics"
    - "Electromagnetism I and II"
    - "Quantum Mechanics"
    - "Thermodynamics and Statistical Mechanics"
    - "Mathematical Methods for Physicists"
    - "Senior Research or Advanced Lab"
  related_majors:
    - "Mathematics"
    - "Engineering Physics"
    - "Astronomy and Astrophysics"
    - "Electrical Engineering"
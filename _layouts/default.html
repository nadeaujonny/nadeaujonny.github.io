<!doctype html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Title: "Page | Site" on inner pages, site title only on homepage -->
  <title>{% if page.url == '/' %}{{ site.title | escape }}{% else %}{{ page.title | escape }} | {{ site.title | escape }}{% endif %}</title>

  <!-- SEO: frontmatter description > auto-excerpt > site description -->
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="keywords" content="data analyst, SQL, Excel, Tableau, Power BI, Python, R, BigQuery, data analysis, portfolio">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">

  <!-- Open Graph (social sharing) -->
  <meta property="og:title" content="{% if page.url == '/' %}{{ site.title | escape }}{% else %}{{ page.title | escape }} | {{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page.url == '/' %}{{ site.title | escape }}{% else %}{{ page.title | escape }} | {{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% include head-custom.html %}

  <!-- Google Fonts (preconnect for faster loading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Structured data: Person schema on homepage -->
  {% if page.url == '/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jonathan Nadeau",
    "jobTitle": "Data Analyst",
    "description": "End-to-end data analyst specializing in SQL, Excel, Tableau, Power BI, Python, and R.",
    "url": "https://nadeaujonny.github.io",
    "sameAs": [
      "https://www.linkedin.com/in/nadeau-jonathan",
      "https://github.com/nadeaujonny"
    ],
    "email": "nadeau.jonny@gmail.com",
    "knowsAbout": ["SQL", "Excel", "Tableau", "Power BI", "Python", "R", "BigQuery", "Data Analysis", "Data Visualization"]
  }
  </script>
  {% endif %}
</head>

  <body>
    <!-- Screen-reader / keyboard skip link — visible only on :focus -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
      <div class="header-inner">
        <nav class="nav-tabs" aria-label="Main navigation">
          <a class="nav-tab" href="{{ '/' | relative_url }}"
             {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>

          <!-- Active on /projects/ and all project sub-pages -->
          <a class="nav-tab" href="{{ '/projects' | relative_url }}"
             {% if page.url contains '/projects' %}aria-current="page"{% endif %}>Projects</a>

          <a class="nav-tab" href="{{ '/' | relative_url }}#contact">Contact</a>

          <a class="nav-tab" href="{{ '/assets/Nadeau_Jonathan_Resume.pdf' | relative_url }}">Resume</a>

          <a class="nav-tab" href="{{ '/assets/Nadeau_Jonathan_CoverLetter.pdf' | relative_url }}">Cover Letter</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>© {{ site.time | date: '%Y' }} {{ site.title }}</div>
        <div class="footer-links">
          <a href="{{ '/projects' | relative_url }}">Projects</a>
          <a href="{{ '/assets/Nadeau_Jonathan_Resume.pdf' | relative_url }}">Resume</a>
          <a href="{{ '/assets/Nadeau_Jonathan_CoverLetter.pdf' | relative_url }}">Cover Letter</a>
        </div>
      </div>
    </footer>
    <!-- Back-to-top: dynamically injected, visible after 400px scroll -->
    <script src="{{ '/assets/js/back-to-top.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/details-animation.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/close-details.js' | relative_url }}" defer></script>
  </body>
</html>
